run:
  name: one_gaussian
  method: hmcl
  seed: 23
  output_dir: runs/one_gaussian
  device: auto

data:
  name: one_gaussian
  n_train: 20000
  n_val: 4096
  batch_size: 1024
  seed: 29
  observation_noise: 1.0

noise:
  sigma_min: 0.01
  sigma_max: 2.3
  distribution: uniform # log_uniform

model:
  num_hypotheses: 9 # 12
  hidden_dim: 192
  depth: 5
  noise_embedding_dim: 64
  noise_hidden_dim: 128
  noise_kind: smooth # log # fourier fouriser_scale: 0.1
  dropout: 0.0

loss:
  assignment: softmin
  temperature_scale: 1.0 # 0.8
  temperature_power: 1.0 # 2.0
  temperature_floor: 0.0005
  detach_responsibilities: true

optim:
  lr: 0.0008
  weight_decay: 0.000001
  steps: 5000 # 3500
  log_every: 100
  val_every: 500

plot:
  num_inputs: 1
  num_sigmas: 16 

