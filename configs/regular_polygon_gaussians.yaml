run:
  name: regular_polygon_gaussians
  method: hmcl
  seed: 23
  output_dir: runs/regular_polygon_gaussians
  device: auto

data:
  name: regular_polygon_gaussians
  n_train: 20000
  n_val: 4096
  batch_size: 1024
  seed: 29
  num_modes: 3
  observation_noise: 0.2

noise:
  sigma_min: 0.001
  sigma_max: 2.5
  distribution: uniform # log_uniform

model:
  name: noise_conditioned_mlp
  num_hypotheses: 9 # 12
  hidden_dim: 192
  depth: 5
  noise_embedding_dim: 64
  noise_hidden_dim: 128
  noise_kind: smooth # log # fourier fourier_scale: 0.1
  dropout: 0.0

loss:
  assignment: softmin
  temperature_scale: 1.0
  temperature_power: 1.0
  temperature_floor: 0.0005 
  detach_responsibilities: true

optim:
  lr: 0.0008
  weight_decay: 0.000001
  steps: 7000
  log_every: 100
  val_every: 500

plot:
  num_inputs: 1
  num_sigmas: 32 
  noise:
    sigma_min: 0.0005
    sigma_max: 2.5
    distribution: log_uniform
